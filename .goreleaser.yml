version: 2
# Pinned: goreleaser otherwise defaults project_name to the GitHub repo name,
# which would rename the binary and every release asset if the repo is renamed
# (it became leanproxy-mcp-bob on 2026-08-27). The tool is still leanproxy-mcp.
project_name: leanproxy-mcp
before:
  hooks:
    - go mod download
builds:
  - id: leanproxy-mcp
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mmornati/leanproxy-mcp/internal/version.Version={{.Version}}
      - -X github.com/mmornati/leanproxy-mcp/internal/version.Commit={{.Commit}}
      - -X github.com/mmornati/leanproxy-mcp/internal/version.BuildTime={{.Date}}
# Developer ID signing + Apple notarization for the darwin binaries.
# Without this, macOS quarantines browser-downloaded binaries and Gatekeeper
# refuses them with "cannot be opened, could not scan for malware" — the Go
# linker's ad-hoc signature is not enough.
#
# Gated on the secrets being present, so forks and local `goreleaser release
# --snapshot` builds keep working unsigned instead of failing.
#
# Cert: "Developer ID Application: Aaron Johnson (CF4U8Z52PH)" — the same
# Developer ID used by trs-80/crisismode. Note that crisismode notarizes via
# Apple ID + app-specific password; goreleaser only speaks App Store Connect
# API keys, so MACOS_NOTARY_* here is a .p8 key, not that Apple ID pair.
notarize:
  macos:
      # NOT isEnvSet: Actions always defines the var, as "" when the secret is
      # missing, and isEnvSet is true for set-but-empty. `index .Env` returns ""
      # for both absent and empty, and empty is falsey — so this stays off until
      # a real certificate is present.
    - enabled: '{{ if index .Env "MACOS_SIGN_P12" }}true{{ else }}false{{ end }}'
      ids: [leanproxy-mcp]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # Wait, so a rejected notarization fails the release instead of
        # silently shipping binaries that Gatekeeper will still block.
        wait: true
        timeout: 20m

archives:
  - id: default
    formats: ["tar.gz"]
    files: []
    # Unversioned asset names so releases/latest/download/ URLs never go stale.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "checksums.txt"
# No release.github block: GoReleaser infers owner/repo from the environment
# (GITHUB_REPOSITORY in Actions, the git remote locally), so any fork can cut
# releases without editing this file.
