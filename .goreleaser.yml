version: 2
before:
  hooks:
    - go mod download
builds:
  - id: leanproxy-mcp
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mmornati/leanproxy-mcp/internal/version.Version={{.Version}}
      - -X github.com/mmornati/leanproxy-mcp/internal/version.Commit={{.Commit}}
      - -X github.com/mmornati/leanproxy-mcp/internal/version.BuildTime={{.Date}}
archives:
  - id: default
    formats: ["tar.gz"]
    files: []
    # Unversioned asset names so releases/latest/download/ URLs never go stale.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "checksums.txt"
release:
  github:
    owner: trs-80
    name: leanproxy-mcp
