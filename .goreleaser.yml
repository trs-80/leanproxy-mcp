version: 2
# Pinned: goreleaser otherwise defaults project_name to the GitHub repo name,
# which would rename the binary and every release asset if the repo is renamed
# (it became leanproxy-mcp-bob on 2026-08-27). The tool is still leanproxy-mcp.
project_name: leanproxy-mcp
before:
  hooks:
    - go mod download
builds:
  - id: leanproxy-mcp
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/trs-80/leanproxy-mcp-bob/internal/version.Version={{.Version}}
      - -X github.com/trs-80/leanproxy-mcp-bob/internal/version.Commit={{.Commit}}
      - -X github.com/trs-80/leanproxy-mcp-bob/internal/version.BuildTime={{.Date}}
# Developer ID signing + Apple notarization for the darwin binaries is NOT
# enabled. Without it, macOS quarantines browser-downloaded binaries and
# Gatekeeper refuses them with "cannot be opened, could not scan for malware";
# the Go linker's ad-hoc signature is not enough. README documents the
# `xattr -d com.apple.quarantine` workaround.
#
# The config below is known-good against the goreleaser v2 schema but must stay
# commented out until the credentials exist. `enabled` does NOT keep goreleaser
# away from the certificate: with the secrets unset it still failed the whole
# release with "need password to decode file", both with isEnvSet and with an
# `index .Env` emptiness check (v0.10.1, runs on 04f8ee6 and 5b6166a).
#
# To turn on: set MACOS_SIGN_P12 / MACOS_SIGN_PASSWORD (Developer ID
# Application cert, "Aaron Johnson (CF4U8Z52PH)" — the same one trs-80/crisismode
# signs with) and MACOS_NOTARY_KEY / _KEY_ID / _ISSUER_ID (App Store Connect
# Team Key, .p8, Developer role). goreleaser has no Apple-ID auth path, so
# crisismode's APPLE_ID / APPLE_ID_PASSWORD / APPLE_TEAM_ID do not transfer.
# Uncomment only once all five are set — an empty value breaks every release.
#
# notarize:
#   macos:
#     - enabled: true
#       ids: [leanproxy-mcp]
#       sign:
#         certificate: "{{ .Env.MACOS_SIGN_P12 }}"
#         password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
#       notarize:
#         issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
#         key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
#         key: "{{ .Env.MACOS_NOTARY_KEY }}"
#         wait: true
#         timeout: 20m

archives:
  - id: default
    formats: ["tar.gz"]
    files: []
    # Unversioned asset names so releases/latest/download/ URLs never go stale.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "checksums.txt"
# No release.github block: GoReleaser infers owner/repo from the environment
# (GITHUB_REPOSITORY in Actions, the git remote locally), so any fork can cut
# releases without editing this file.
